<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>To-Do List</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <div class="task-form">
    <ion-item>
      <ion-input
        label="Nueva tarea"
        labelPlacement="stacked"
        placeholder="Escribe una tarea"
        [(ngModel)]="newTaskTitle"
        (keyup.enter)="addTask()">
      </ion-input>
    </ion-item>

    <ion-button expand="block" class="add-button" (click)="addTask()">
      Agregar tarea
    </ion-button>
  </div>

  <div *ngIf="tasks.length === 0" class="empty-state">
    <ion-text color="medium">
      <p>No hay tareas registradas todavía.</p>
    </ion-text>
  </div>

  <ion-list *ngIf="tasks.length > 0">
    <ion-item *ngFor="let task of tasks; trackBy: trackByTaskId">
      <ion-checkbox
        slot="start"
        [checked]="task.completed"
        (ionChange)="toggleTask(task.id)">
      </ion-checkbox>

      <ion-label [class.completed]="task.completed">
        {{ task.title }}
      </ion-label>

      <ion-button
        fill="clear"
        color="danger"
        slot="end"
        (click)="deleteTask(task.id)">
        Eliminar
      </ion-button>
    </ion-item>
  </ion-list>
</ion-content>
